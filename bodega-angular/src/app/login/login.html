<main class="container main-container">

  <div class="row g-0">

    <section class="col-lg-6 panel-formulario">

      <header class="logo mb-4 text-center">
        <div class="mb-2">
          <span class="fs-4">🏪</span>
        </div>

        <h2>Minimarket <span>Los Robles</span></h2>
      </header>

      <form>

        <div class="mb-3">
          <label for="usuario" class="form-label">Ingresa tu ID</label>

          <div class="input-group">
            <span class="input-group-text">🔑</span>

            <input type="text" id="usuario" class="form-control" placeholder="ID de usuario">
          </div>
        </div>

        <div class="mb-3">
          <label for="clave" class="form-label">Contraseña</label>

          <div class="input-group">
            <span class="input-group-text">🔒</span>

            <input type="password" id="clave" class="form-control" placeholder="Contraseña">
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 btn-lg">
          Iniciar Sesión
        </button>

      </form>

    </section>

    <section class="col-lg-6 d-none d-lg-flex panel-imagen">
      <img src="assets/imagenes/login.png" class="img-fluid">
    </section>

  </div>

</main>
