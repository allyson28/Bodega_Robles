<main class="container shadow-lg rounded-4 overflow-hidden bg-white my-5">
  <div class="row g-0 min-vh-75">

    <section class="col-12 col-lg-6 p-4 p-md-5 d-flex flex-column justify-content-center bg-white">

      <header class="logo mb-4 text-center">
        <div class="mb-2 fs-1 text-success">🏪</div>
        <h2 class="h3 mb-0 text-dark">Minimarket <span class="text-success">Los Robles</span></h2>
      </header>

      <form>
        <div class="mb-4">
          <label for="usuario" class="form-label fw-medium text-secondary">Ingresa tu ID</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-light border-end-0">🔑</span>
            <input #usuarioInput type="text" id="usuario" class="form-control bg-light border-start-0" placeholder="ID de usuario">
          </div>
        </div>

        <div class="mb-4">
          <label for="clave" class="form-label fw-medium text-secondary">Contraseña</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-light border-end-0">🔒</span>
            <input #passwordInput type="password" id="clave" class="form-control bg-light border-start-0" placeholder="Contraseña">
          </div>
        </div>

        <div
          *ngIf="mensaje"
          class="alert alert-danger shadow-sm text-center"
          role="alert">
          {{ mensaje }}
        </div>
        <button type="button"
                (click)="iniciarSesion(usuarioInput.value, passwordInput.value)"
                class="btn btn-success w-100 btn-lg py-3 fw-semibold shadow-sm transition-all">
          Iniciar Sesión
        </button>
      </form>

    </section>

    <section class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-success bg-opacity-10 p-5">
      <img src="/login.png" class="img-fluid object-fit-contain w-75 animated-image" alt="Login Minimarket">
    </section>

  </div>
</main>
