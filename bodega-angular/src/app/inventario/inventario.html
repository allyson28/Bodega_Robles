<div class="container-fluid p-0">
  
  <h1 class="h3 mb-4 text-dark fw-bold">Gestión de Inventario</h1>

  <div class="card border-0 shadow-sm p-4 mb-4 bg-white rounded-3">
    <div class="d-flex flex-wrap align-items-center gap-3">
      
      <button class="btn btn-success px-4 fw-semibold shadow-sm d-flex align-items-center gap-2" id="boton-crear-producto">
        <span>➕</span> Crear Item
      </button>
      
      <div class="flex-grow-1 min-w-200">
        <input type="text" id="buscarItem" placeholder="Buscar por nombre..." class="form-control bg-light">
      </div>
      
      <div class="min-w-200">
        <select id="filtroCategoria" class="form-select bg-light">
          <option value="">Filtrar por categoría</option>
          <option value="1">Bebidas</option>
          <option value="2">Abarrotes</option>
          <option value="3">Limpieza</option>
        </select>
      </div>

    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-3 overflow-hidden bg-white mb-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-success text-uppercase fs-7 text-nowrap">
          <tr>
            <th class="py-3 px-4 text-success-dark">ID</th>
            <th class="py-3 text-success-dark">SKU</th>
            <th class="py-3 text-success-dark">Nombre</th>
            <th class="py-3 text-success-dark">Descripción</th>
            <th class="py-3 text-success-dark">Categoría</th>
            <th class="py-3 text-success-dark">Marca</th>
            <th class="py-3 text-success-dark">Stock</th>
            <th class="py-3 text-success-dark">Unidad</th>
            <th class="py-3 px-4 text-center text-success-dark">Acciones</th>
          </tr>
        </thead>
        <tbody class="fs-6">
          
          <tr>
            <td class="py-3 px-4 fw-bold text-secondary">1</td>
            <td class="py-3 text-nowrap"><span class="badge bg-light text-dark border font-monospace">PROD-001</span></td>
            <td class="py-3 fw-medium text-dark">Arroz Integral</td>
            <td class="py-3 text-secondary">Bolsa de 1kg</td>
            <td class="py-3">
              <span class="badge bg-success bg-opacity-10 text-success px-2 py-1 fs-7">Abarrotes</span>
            </td>
            <td class="py-3 text-secondary">Costeño</td>
            <td class="py-3">
              <span class="fw-bold text-success">50</span>
            </td>
            <td class="py-3 text-muted small">KG</td>
            <td class="py-3 px-4 text-center">
              <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-sm btn-outline-primary px-3 d-flex align-items-center gap-1" data-id="1">
                  <span>✏️</span> Editar
                </button>
                <button class="btn btn-sm btn-outline-danger px-3 d-flex align-items-center gap-1" data-id="1">
                  <span>🗑️</span> Eliminar
                </button>
              </div>
            </td>
          </tr>

          <tr>
            <td class="py-3 px-4 fw-bold text-secondary">2</td>
            <td class="py-3 text-nowrap"><span class="badge bg-light text-dark border font-monospace">PROD-002</span></td>
            <td class="py-3 fw-medium text-dark">Agua Mineral</td>
            <td class="py-3 text-secondary">Botella de 500ml</td>
            <td class="py-3">
              <span class="badge bg-info bg-opacity-10 text-info px-2 py-1 fs-7">Bebidas</span>
            </td>
            <td class="py-3 text-secondary">San Mateo</td>
            <td class="py-3">
              <span class="fw-bold text-dark">120</span>
            </td>
            <td class="py-3 text-muted small">Unidades</td>
            <td class="py-3 px-4 text-center">
              <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-sm btn-outline-primary px-3 d-flex align-items-center gap-1" data-id="2">
                  <span>✏️</span> Editar
                </button>
                <button class="btn btn-sm btn-outline-danger px-3 d-flex align-items-center gap-1" data-id="2">
                  <span>🗑️</span> Eliminar
                </button>
              </div>
            </td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>

</div>
